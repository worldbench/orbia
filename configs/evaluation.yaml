evaluator:
  device: cuda
  feature_backend: dinov2
  dino_repo: /local/source/dinov2
  dino_checkpoint: /local/weights/dinov2_vits14_pretrain.pth
  lpips_checkpoint: /local/weights/alex.pth
  musiq_checkpoint: /local/weights/musiq.pth
  aesthetic_clip_checkpoint: /local/weights/ViT-L-14.pt
  aesthetic_checkpoint: /local/weights/aesthetic.pth
  vbench_root: /local/source/VBench
  amt_config: /local/source/VBench/vbench/third_party/amt/cfgs/AMT-S.yaml
  amt_checkpoint: /local/weights/amt-s.pth
  tier2_quality_frame_stride: 4
  tier2_amt_triplet_stride: 8
  da3_repo: /local/source/Depth-Anything-3
