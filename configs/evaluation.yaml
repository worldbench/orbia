  geometry_visibility_relative_tolerance: 0.1
  anchor_sam_python: null
  anchor_sam_repo: /local/source/sam3
  anchor_sam_checkpoint: /local/weights/sam3.1_multiplex.pt
  anchor_tracking_stride: 4
quality:
  hps_repo: /local/source/HPSv3
  hps_config: /local/source/HPSv3/hpsv3/config/HPSv3_7B.yaml
  hps_checkpoint: /local/weights/HPSv3.safetensors
